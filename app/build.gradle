plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplekiosk.player'
    compileSdk 19

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.simplekiosk.player'
        minSdk 19
        targetSdk 19
        versionCode 7
        versionName '0.6.0'
    }
}




